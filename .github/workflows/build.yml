# On every push: type-check, lint (including module-boundary rules), run tests,
# then build the Windows installer and attach it to the run as a downloadable artifact.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: ReqMan-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
