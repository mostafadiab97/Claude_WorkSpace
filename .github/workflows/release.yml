# Publishing a release: change "version" in package.json and push to main.
# If no GitHub Release exists for that version yet, this builds the Windows installer and publishes it
# as release v<version> (GitHub creates the tag). That release feed is what installed copies of reqochet-dev
# check for automatic updates. Can also be started by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

# read by default (SEC-03); the job writes only the release (gh release create, token passed to that step)
permissions:
  contents: read

jobs:
  windows:
    # a release (the update every installed copy takes) is made only from main, also when started by hand (W-31)
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 120 # (CR3-19)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secrets check

      - name: Privacy and secrets check (CR3-25 — the release checks the same as every build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/check-privacy.mjs .
          # the secrets scanner: downloaded with gh (signed in with this run's token, so no anonymous rate limit), retried;
          # a failed download stops the step with a clear message (8 Nov 2026: curl got an answer that was not a zip)
          for attempt in 1 2 3; do
            rm -f "$RUNNER_TEMP"/gitleaks_*.zip
            gh release download v8.28.0 -R gitleaks/gitleaks -p 'gitleaks_8.28.0_windows_x64.zip' -D "$RUNNER_TEMP" --clobber && unzip -tq "$RUNNER_TEMP/gitleaks_8.28.0_windows_x64.zip" && break
            echo "gitleaks download attempt $attempt failed"; sleep 20
          done
          unzip -q -o "$RUNNER_TEMP/gitleaks_8.28.0_windows_x64.zip" -d "$RUNNER_TEMP/gitleaks" || { echo "::error::Could not download the gitleaks secrets scanner from GitHub (3 attempts). Rerun the job later."; exit 1; }
          "$RUNNER_TEMP/gitleaks/gitleaks.exe" git . --no-banner --redact

      - name: Skip if this version is already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$v is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $v"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install (retried)
        if: steps.version.outputs.exists == 'false'
        shell: bash
        # Electron comes through gh, signed in with this run's token, checksum checked (tools/ci-electron.mjs):
        # 8 Nov 2026 GitHub answered the anonymous Electron download with 504 for hours, signed-in downloads worked
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        # --ignore-scripts: no library runs code at install time, so none can change files that later steps run with
        # the token (W-31, SEC-WP2-02); the only scripts were esbuild's (optional) and electron-winstaller's (unused)
        run: for attempt in 1 2 3; do npm ci --ignore-scripts && exit 0; echo "npm ci attempt $attempt failed; waiting"; sleep 60; done; exit 1
      # the token only here, not while libraries' install scripts run (SEC-18-01)
      - name: Electron (signed-in download, checksum from the locked package)
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/ci-electron.mjs
          node -e "require('electron')"
      - if: steps.version.outputs.exists == 'false'
        run: npm run check
      - name: Performance tests (data layer 10,000 and 50,000 items; workspace 10,000)
        if: steps.version.outputs.exists == 'false'
        run: npm run test:perf:all
      - if: steps.version.outputs.exists == 'false'
        run: npm run build
      - name: End-to-end scenarios (drive the real app)
        if: steps.version.outputs.exists == 'false'
        run: npm run test:e2e
      - name: Upload end-to-end screenshots (also when a step failed — CR3-26)
        if: always() && steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-screenshots-release
          path: e2e/out/*.png
          if-no-files-found: ignore

      - name: Build installer
        if: steps.version.outputs.exists == 'false'
        run: npx electron-builder --win --publish never --config.electronDist=node_modules/electron/dist --config.publish.owner=${{ github.repository_owner }} --config.publish.repo=${{ github.event.repository.name }}

      - name: Acceptance run on the installed app (P-41 — replaces the owner's manual checklist steps)
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=""
          if gh release download --pattern "*-Setup-*.exe" --dir "$RUNNER_TEMP/previous" 2>/dev/null; then
            prev="$(ls "$RUNNER_TEMP"/previous/*-Setup-*.exe | head -1)"
          fi
          git clone --quiet --depth 1 https://github.com/${{ github.repository_owner }}/Claude_SandBox.git "$RUNNER_TEMP/sandbox"
          node e2e/acceptance.mjs \
            --installer "$(ls dist/*-Setup-*.exe | head -1)" --feed dist \
            ${prev:+--previous "$prev"} \
            --sandbox "$RUNNER_TEMP/sandbox" \
            --push-url "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            --branch "ci/acceptance-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: List build output
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: ls -la dist

      # A zipped copy of the installer, for browsers or company filters that block .exe downloads.
      - name: Zip installer
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: Get-ChildItem dist/*-Setup-*.exe | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.exe$', '.zip') }

      # latest.yml + the installer + its .blockmap are what installed copies read to update themselves.
      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "reqochet-dev ${tag#v}" \
            --notes "Install: download reqochet-dev-Setup-${tag#v}.exe below and run it (or the .zip if your browser blocks the .exe). Installed copies update automatically." \
            dist/*-Setup-*.exe dist/*-Setup-*.exe.blockmap dist/*-Setup-*.zip dist/latest.yml
