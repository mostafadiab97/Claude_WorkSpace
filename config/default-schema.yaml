# ReqMan default schema.
# Copied into a project as requirements/.reqman/schema.yaml when the requirements folder is created.
# The project's copy is versioned with its requirements; edit that copy to add types, fields or link types.
#
# Built-in item properties (always present, not listed here): id, type, title, parent, order, links, text.
# Every item's ID is REQ- plus 7 random characters, whatever its type, so the type can change later.

version: 1

itemTypes:
  - { id: stakeholder-need,     name: Stakeholder Need }
  - { id: system-requirement,   name: System Requirement }
  - { id: software-requirement, name: Software Requirement }
  - { id: hardware-requirement, name: Hardware Requirement }
  - { id: interface-requirement, name: Interface Requirement }
  - { id: use-case,             name: Use Case }
  - { id: design-element,       name: Design Element }
  - { id: test-case,            name: Test Case }
  - { id: defect,               name: Defect }
  - { id: risk,                 name: Risk }
  - { id: change-request,       name: Change Request }
  # Headings and explanatory text that structure a specification; not counted as requirements.
  - { id: information,          name: Heading / Information, requirement: false }

fields:
  - id: status
    name: Status
    type: enum
    options: [Draft, Review, Approved, Obsolete]
    default: Draft
  - id: priority
    name: Priority
    type: enum
    options: [High, Medium, Low]
  - id: owner
    name: Owner
    type: text
  - id: tags
    name: Tags
    type: list

linkTypes:
  - { id: refines,    name: refines,       reverseName: refined by }
  - { id: satisfies,  name: satisfies,     reverseName: satisfied by }
  - { id: implements, name: implements,    reverseName: implemented by }
  - { id: verifies,   name: verifies,      reverseName: verified by }
  - { id: mitigates,  name: mitigates,     reverseName: mitigated by }
  - { id: relates-to, name: relates to,    reverseName: related to }
