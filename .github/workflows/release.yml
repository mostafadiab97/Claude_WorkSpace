# Publishing a release: change "version" in package.json and push to main.
# If no GitHub Release exists for that version yet, this builds the Windows installer and publishes it
# as release v<version> (GitHub creates the tag). That release feed is what installed copies of ReqMan
# check for automatic updates. Can also be started by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this version is already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$v is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $v"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        run: npm run check
      - if: steps.version.outputs.exists == 'false'
        run: npm run build

      - name: Build installer and publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        run: npx electron-builder --win --publish always -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
