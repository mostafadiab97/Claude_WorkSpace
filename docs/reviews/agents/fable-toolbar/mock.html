<!doctype html>
<meta charset="utf-8">
<title>Toolbar mock-up</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../../marketing/video/src/fonts/Inter-Regular.otf)}
@font-face{font-family:Inter;font-weight:500;src:url(../../../marketing/video/src/fonts/Inter-Medium.otf)}
@font-face{font-family:Inter;font-weight:600;src:url(../../../marketing/video/src/fonts/Inter-SemiBold.otf)}
*{box-sizing:border-box}
body{margin:0;padding:28px 30px 34px;background:#dfe2e7;font:14px Inter,sans-serif;color:#1b1f27;width:max-content}
h1{font-size:22px;margin:0 0 4px}
p.lead{margin:0 0 20px;color:#566070;font-size:14px}
.cap{font-size:13px;font-weight:600;margin:20px 0 6px;display:flex;gap:10px;align-items:baseline}
.cap span{font-weight:400;color:#566070}
.cap b.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:#1b1f27;color:#fff}
.cap b.tag.new{background:#137a39}
.win{border-radius:8px;overflow:hidden;box-shadow:0 2px 10px #0003;background:var(--bg);color:var(--text);position:relative}
.top{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap;overflow:hidden}
.top .logo{font-weight:600;font-size:17px;letter-spacing:.02em}.top .dev{font-size:11px;color:var(--muted);letter-spacing:.08em}
.top .proj{font-weight:600}.top .sp{flex:1}
.top .tab{font-size:12px;padding:4px 10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;row-gap:4px;padding:4px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.bar .sp{flex:1}
.btn,.sel,.inp{height:32px;border:1px solid var(--borderStrong);border-radius:6px;background:var(--surface);color:var(--text);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font:inherit;white-space:nowrap}
.btn.small{height:24px;font-size:12px;padding:0 9px}
.btn.active{background:var(--selection);border-color:var(--primary);color:var(--primary)}
.btn.primary,.sel.primary{background:var(--primary);border-color:var(--primary);color:var(--primaryText);font-weight:600}
.sel.dis{background:var(--surfaceAlt);color:var(--muted);border-color:var(--border)}
.inp{color:var(--muted);width:260px;flex:0 1 260px;min-width:120px;overflow:hidden}
.inp.grow{flex:1 1 100px;width:auto;min-width:90px;max-width:420px}
.ib{width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);border:1px solid transparent;position:relative;flex:none}
.ib.box{border-color:var(--borderStrong)}
.ib.danger,.lnk.danger{color:var(--danger)}
.lnk{color:var(--primary);font-size:12px;white-space:nowrap;display:inline-flex;gap:3px;align-items:center}
.lbl{color:var(--muted);font-size:12px}
.grp{display:inline-flex;gap:8px}
.sep{width:1px;height:20px;background:var(--border);margin:0 2px;flex:none}
.doc{height:32px;border:1px solid var(--borderStrong);border-radius:6px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;font-weight:600;white-space:nowrap;min-width:0;flex:0 1 auto}
.doc .n{font-weight:400;color:var(--muted);font-size:12px}
.doc .nm{overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:15px;height:15px;border-radius:8px;background:var(--primary);color:var(--primaryText);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:13px;height:13px}
.th,.tr{display:grid;grid-template-columns:70px 1fr 90px 90px 130px;font-size:13px;border-bottom:1px solid var(--border)}
.th{background:var(--surfaceAlt);font-weight:600;font-size:12px}.th div,.tr div{padding:8px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{background:var(--surface)}.tr.selrow{background:var(--selection);box-shadow:inset 3px 0 var(--primary)}
.tr .id{font-family:monospace;font-size:12px}
.split{display:grid}
.editor{background:var(--surface);border-inline-start:1px solid var(--border);padding:12px 14px;font-size:13px}
.editor .f{height:30px;border:1px solid var(--borderStrong);border-radius:6px;margin:4px 0 10px;padding:6px 9px}
.editor small{color:var(--muted)}
.pop{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px #0004;padding:6px;width:max-content;min-width:230px;font-size:13px}
.pop .mi{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:5px;white-space:nowrap}
.pop .mi.on{background:var(--selection)}
.pop .mi .k{margin-inline-start:auto;padding-inline-start:22px;color:var(--muted);font-size:11px}
.pop .mi.danger{color:var(--danger)}.pop .mi.off{color:var(--muted);opacity:.6}
.pop hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.pop h4{margin:4px 9px 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.radio{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--borderStrong);flex:none}.radio.on{border:4px solid var(--primary)}
.states{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.states figure{margin:0}.states figcaption{font-size:12px;color:#566070;margin:0 0 6px;max-width:300px}
.tip{display:inline-block;background:#1b1f27;color:#fff;font-size:11px;border-radius:4px;padding:3px 7px;margin-top:5px}
.light{--bg:L_background;--surface:L_surface;--surfaceAlt:L_surfaceAlt;--text:L_text;--muted:L_textMuted;--border:L_border;--borderStrong:L_borderStrong;--primary:L_primary;--primaryText:L_primaryText;--danger:L_danger;--selection:L_selection}
.ember{--bg:E_background;--surface:E_surface;--surfaceAlt:E_surfaceAlt;--text:E_text;--muted:E_textMuted;--border:E_border;--borderStrong:E_borderStrong;--primary:E_primary;--primaryText:E_primaryText;--danger:E_danger;--selection:E_selection}
</style>
<body>
<script>
const q=new URLSearchParams(location.search), W=+q.get('w')||1280
const P={chev:'<path d="m6 9 6 6 6-6"/>',exp:'<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',col:'<path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/>',
filter:'<path d="M3 6h18M7 12h10M10 18h4"/>',cols:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-6 7"/>',
merge:'<circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v12M6 9c0 6 6 10 10 10"/>',imp:'<path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/>',expo:'<path d="M12 15V3m-5 5 5-5 5 5M4 21h16"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',check:'<path d="M20 6 9 17l-5-5"/>',fold:'<path d="M3 5h12M7 12h10M7 19h10"/><path d="m19 3 2 2-2 2"/>',doc:'<path d="M6 3h8l4 4v14H6zM14 3v4h4"/>'}
const i=(n,c='')=>`<svg class="${c}" viewBox="0 0 24 24">${P[n]}</svg>`
const topBar=`<div class="top"><span class="logo">reqochet</span><span class="dev">DEV</span><span class="lbl">/</span><span class="proj">door-controller</span>${i('x','s')}
 <span class="btn small">${i('branch','s')} main ${i('chev','s')}</span><span class="btn small">Pull</span><span class="btn small">Push</span><span class="sep"></span><span class="tab">Changes</span><span class="tab">Versions</span><span class="tab">Traceability</span><span class="sp"></span>${i('gear')}</div>`
const rows=(n=3)=>`<div class="th"><div>No.</div><div>Title</div><div>Type</div><div>Status</div><div>ID</div></div>`+
 [['1','Door lock','SysReq','Approved','REQ-D2HEP0T'],['1.1','Lock on speed above 15 km/h','SysReq','Draft','REQ-XKBNVR5'],['1.2','Unlock on crash signal','SysReq','Draft','REQ-7M2QK9A']].slice(0,n)
 .map((r,k)=>`<div class="tr ${k==1?'selrow':''}"><div>${r[0]}</div><div style="padding-inline-start:${r[0].length>1?34:12}px">${r[1]}</div><div>${r[2]}</div><div>${r[3]}</div><div class="id">${r[4]}</div></div>`).join('')
const current=()=>`<div class="bar"><span class="lbl">Document</span><span class="sel" style="height:24px;font-size:12px;padding:0 8px">Specification (42) ${i('chev','s')}</span>
 <span class="lnk">New document…</span><span class="lnk">Rename…</span><span class="lnk danger">${i('trash','s')}Delete…</span><span class="lnk">Merge into…</span>
 <span class="inp">Search ID, title, text…</span><span class="ib">${i('exp')}</span><span class="ib">${i('col')}</span>
 <span class="btn">${i('filter','s')} Filters</span><span class="btn">${i('cols','s')} Columns ${i('chev','s')}</span><span class="btn active">Show text</span><span class="btn">Import…</span><span class="btn">Export…</span>
 <span class="sp"></span><span class="grp"><span class="sel">Below the selected item ${i('chev','s')}</span><span class="sel primary">+ New item ${i('chev','s')}</span></span></div>`
const proposed=(narrow)=>`<div class="bar"><span class="doc"><span class="nm">Specification</span><span class="n">${narrow?'42':'42 items'}</span>${i('chev','s')}</span>${narrow?'':'<span class="sep"></span>'}
 <span class="inp grow">${i('search','s')} Search…</span>
 <span class="ib box">${i('exp')}</span><span class="ib box">${i('filter')}<span class="badge">2</span></span><span class="ib box">${i('cols')}</span><span class="ib box">${i('more')}</span>
 <span class="sp"></span>${narrow?`<span class="ib box" style="background:var(--primary);border-color:var(--primary);color:var(--primaryText)">${i('plus')}</span>`:`<span class="btn primary">${i('plus','s')} New item</span>`}</div>`
const literal=()=>`<div class="bar"><span style="font-weight:600;border-bottom:1px dashed var(--borderStrong)">Specification</span><span class="lbl">42 items</span><span class="ib">${i('chev')}</span><span class="ib">${i('plus')}</span><span class="ib danger">${i('trash')}</span><span class="sep"></span>
 <span class="inp grow">${i('search','s')} Search…</span><span class="ib box">${i('exp')}</span><span class="ib box">${i('filter')}</span><span class="ib box">${i('cols')}</span><span class="ib box">${i('more')}</span><span class="sp"></span><span class="ib box" style="background:var(--primary);border-color:var(--primary);color:var(--primaryText)">${i('plus')}</span></div>`
const win=(mode,bar,w,ed)=>`<div class="win ${mode}" style="width:${w}px">${topBar}${ed?`<div class="split" style="grid-template-columns:1fr ${ed}px"><div style="min-width:0">${bar}${rows()}</div><div class="editor"><b>1.1 REQ-XKBNVR5</b><br><small>System Requirement</small><br><br><small>Title</small><div class="f">Lock on speed above 15 km/h</div><small>Type</small><div class="f">System Requirement</div></div></div>`:bar+rows()}</div>`
const cap=(t,tag,note)=>`<div class="cap"><b class="tag ${tag=='Proposed'?'new':''}">${tag}</b>${t}<span>${note||''}</span></div>`
let h=`<h1>Bar above the table — current and proposed, ${W} px window</h1><p class="lead">Mock-up (render.mjs) drawn with the colours of config/theme.json (Light and Ember). Not a screenshot of the app; the top bar is simplified.</p>`
for(const [m,name] of [['light','Light'],['ember','Ember']]){
 h+=cap(name,'Current','15 controls, two rows')+win(m,current(),W)
 h+=cap(name,'Proposed','7 controls, one row')+win(m,proposed(false),W)
}
if(W<1000){
 h+=cap('Light — item editor open (table part '+(W-380)+' px)','Current','four rows before the table starts')+win('light',current(),W,380)
 h+=cap('Light — item editor open','Proposed','still one row: “New item” shrinks to its plus sign, the count to its number')+win('light',proposed(true),W,380)
 h+=cap('Ember — item editor open','Proposed')+win('ember',proposed(true),W,380)
}else{
 h+=cap('Light — the owner’s layout taken literally','Variant','name edits on click · count · arrow · plus · bin. Two plus signs, a bin always in reach, and the name no longer looks clickable for switching')+win('light',literal(),W)
 h+=`<div class="cap"><b class="tag new">Proposed</b>What opens from the four buttons<span>each icon button has a tooltip with its name and shortcut</span></div><div class="states">
 <figure class="light"><figcaption>Document button: choose, and everything that acts on the document</figcaption><div class="pop"><h4>Documents</h4>
  <div class="mi">All documents <span class="k">118</span></div><div class="mi on">${i('check','s')} Specification <span class="k">42</span></div><div class="mi">Stakeholder needs <span class="k">31</span></div><div class="mi">Tests <span class="k">45</span></div><hr>
  <div class="mi">${i('plus','s')} New document… <span class="k">Ctrl+Shift+N</span></div><div class="mi">${i('pen','s')} Rename “Specification”… <span class="k">F2</span></div><div class="mi">${i('merge','s')} Merge “Specification” into…</div><div class="mi danger">${i('trash','s')} Delete “Specification”…</div></div></figure>
 <figure class="light"><figcaption>Outline button: one button, both directions always named (greyed when there is nothing to do)</figcaption><div class="pop"><div class="mi">${i('exp','s')} Expand all <span class="k">Ctrl+Shift+↓</span></div><div class="mi">${i('col','s')} Collapse all <span class="k">Ctrl+Shift+↑</span></div><hr><h4>Later, if wanted</h4><div class="mi off">Show down to level 1 · 2 · 3</div></div>
  <span class="tip">Expand or collapse all</span></figure>
 <figure class="ember"><figcaption>New item (Ctrl+N): type and place in one panel; Enter creates, the editor opens as today</figcaption><div class="pop" style="min-width:270px"><h4>Type</h4>
  <div class="mi on"><span class="radio on"></span> System Requirement</div><div class="mi"><span class="radio"></span> Stakeholder Need</div><div class="mi"><span class="radio"></span> Test Case</div><div class="mi"><span class="radio"></span> Heading</div><hr><h4>Where</h4>
  <div class="mi on"><span class="radio on"></span> Below “Lock on speed above…”</div><div class="mi"><span class="radio"></span> Inside it</div><div class="mi"><span class="radio"></span> At the end of the document</div><hr>
  <div style="display:flex;justify-content:flex-end;gap:8px;padding:4px"><span class="btn small">Cancel</span><span class="btn small primary">Create</span></div></div></figure>
 <figure class="ember"><figcaption>View button (was Columns + Show text) and More button (was Import… and Export…)</figcaption><div style="display:flex;gap:12px;align-items:flex-start"><div class="pop"><h4>Rows</h4><div class="mi on"><span class="radio on"></span> Title and text</div><div class="mi"><span class="radio"></span> One line per item</div><hr><h4>Columns</h4><div class="mi">${i('check','s')} Type</div><div class="mi">${i('check','s')} Status</div><div class="mi">${i('check','s')} Links</div><div class="mi off">…</div><hr><div class="mi">Fields… · Types…</div></div>
  <div class="pop" style="min-width:150px"><div class="mi">${i('imp','s')} Import…</div><div class="mi">${i('expo','s')} Export…</div></div></div></figure></div>`
}
document.body.innerHTML+=h
</script>
