# Publishing a release: change "version" in package.json and push to main.
# If no GitHub Release exists for that version yet, this builds the Windows installer and publishes it
# as release v<version> (GitHub creates the tag). That release feed is what installed copies of reqochet-dev
# check for automatic updates. Can also be started by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

# read by default (SEC-03); the job writes only the release (gh release create, token passed to that step)
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secrets check

      - name: Privacy and secrets check (CR3-25 — the release checks the same as every build)
        shell: bash
        run: |
          node tools/check-privacy.mjs .
          curl -sSL -o "$RUNNER_TEMP/gitleaks.zip" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_windows_x64.zip
          unzip -q -o "$RUNNER_TEMP/gitleaks.zip" -d "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks.exe" git . --no-banner --redact

      - name: Skip if this version is already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$v is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $v"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        run: npm run check
      - name: Performance tests (10,000 and 50,000 items)
        if: steps.version.outputs.exists == 'false'
        run: npm run test:perf:all
      - if: steps.version.outputs.exists == 'false'
        run: npm run build
      - name: End-to-end scenarios (drive the real app)
        if: steps.version.outputs.exists == 'false'
        run: npm run test:e2e

      - name: Build installer
        if: steps.version.outputs.exists == 'false'
        run: npx electron-builder --win --publish never --config.publish.owner=${{ github.repository_owner }} --config.publish.repo=${{ github.event.repository.name }}

      - name: Acceptance run on the installed app (P-41 — replaces the owner's manual checklist steps)
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=""
          if gh release download --pattern "*-Setup-*.exe" --dir "$RUNNER_TEMP/previous" 2>/dev/null; then
            prev="$(ls "$RUNNER_TEMP"/previous/*-Setup-*.exe | head -1)"
          fi
          git clone --quiet --depth 1 https://github.com/${{ github.repository_owner }}/Claude_SandBox.git "$RUNNER_TEMP/sandbox"
          node e2e/acceptance.mjs \
            --installer "$(ls dist/*-Setup-*.exe | head -1)" --feed dist \
            ${prev:+--previous "$prev"} \
            --sandbox "$RUNNER_TEMP/sandbox" \
            --push-url "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            --branch "ci/acceptance-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: List build output
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: ls -la dist

      # A zipped copy of the installer, for browsers or company filters that block .exe downloads.
      - name: Zip installer
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: Get-ChildItem dist/*-Setup-*.exe | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.exe$', '.zip') }

      # latest.yml + the installer + its .blockmap are what installed copies read to update themselves.
      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "reqochet-dev ${tag#v}" \
            --notes "Install: download reqochet-dev-Setup-${tag#v}.exe below and run it (or the .zip if your browser blocks the .exe). Installed copies update automatically." \
            dist/*-Setup-*.exe dist/*-Setup-*.exe.blockmap dist/*-Setup-*.zip dist/latest.yml
