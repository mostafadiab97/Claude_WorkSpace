# On every push: type-check, lint (including module-boundary rules), run tests,
# then build the Windows installer and attach it to the run as a downloadable artifact.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Performance tests (10,000 and 50,000 items)
        run: npm run test:perf
      - name: End-to-end journey (drives the real app)
        run: |
          npm run build
          npm run test:e2e
      - name: Large repository smoke test (10,000 generated items in the real app)
        shell: bash
        run: |
          repo="$RUNNER_TEMP/scenario-10k"
          git init -q "$repo"
          npm run gen:scenario -- "$repo" 10000
          npm run measure:ui -- "$repo"
      - name: Upload end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/out/*.png
          if-no-files-found: ignore
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: ReqMan-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
