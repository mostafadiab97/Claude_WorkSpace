# Packaging configuration (electron-builder).
# The development tool built from this repository (owner, 4 Nov 2026): its own identity, so it can sit beside the
# release tool "reqochet" (built from the release repository with appId com.reqochet.app, productName reqochet).
appId: com.reqochet.dev
productName: reqochet-dev
directories:
  output: dist
files:
  - out/**
  - package.json
# User-editable configuration and assets are shipped as plain files next to the app,
# so the theme (and later the default schema and export templates) can be changed without rebuilding.
extraResources:
  - from: config
    to: config
  - from: resources
    to: resources
win:
  # the brand package's Windows icon (dark tile, 16–256 px inside)
  icon: resources/brand/icon/reqochet.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # One-click, per-user install: no administrator rights needed.
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  # removes an installed ReqMan first (the 0.16 switch) — build/installer.nsh
  include: build/installer.nsh
linux:
  target: [dir]
# Release feed for automatic updates: GitHub Releases of this repository. Owner and repository name are not stored
# here (no account names in the files): CI passes them (-c.publish.owner / -c.publish.repo), and a local build
# reads them from the Git remote. electron-builder writes them into the installed app's app-update.yml.
publish:
  provider: github
