# Publishing a release: change "version" in package.json and push to main.
# If no GitHub Release exists for that version yet, this builds the Windows installer and publishes it
# as release v<version> (GitHub creates the tag). That release feed is what installed copies of ReqMan
# check for automatic updates. Can also be started by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skip if this version is already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$v is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $v"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        run: npm run check
      - name: Performance tests (10,000 and 50,000 items)
        if: steps.version.outputs.exists == 'false'
        run: npm run test:perf:all
      - if: steps.version.outputs.exists == 'false'
        run: npm run build
      - name: End-to-end scenarios (drive the real app)
        if: steps.version.outputs.exists == 'false'
        run: npm run test:e2e

      - name: Build installer
        if: steps.version.outputs.exists == 'false'
        run: npx electron-builder --win --publish never

      - name: List build output
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: ls -la dist

      # A zipped copy of the installer, for browsers or company filters that block .exe downloads.
      - name: Zip installer
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: Get-ChildItem dist/ReqMan-Setup-*.exe | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.exe$', '.zip') }

      # latest.yml + the installer + its .blockmap are what installed copies read to update themselves.
      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "ReqMan ${tag#v}" \
            --notes "Install: download ReqMan-Setup-${tag#v}.exe below and run it (or the .zip if your browser blocks the .exe). Installed copies update automatically." \
            dist/ReqMan-Setup-*.exe dist/ReqMan-Setup-*.exe.blockmap dist/ReqMan-Setup-*.zip dist/latest.yml
