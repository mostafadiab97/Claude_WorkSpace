 25%{transform:translate(54px,0)}
 50%{transform:translate(0,54px)}
 75%{transform:translate(-54px,0)}
 100%{transform:translate(0,-54px)}
}
@keyframes blink{
 0%,66%,69.5%,92%,94.5%,96%,98.5%,100%{transform:scaleY(1)}
 67.6%,93.2%,97.2%{transform:scaleY(.08)}
}
@keyframes blinkslow{
